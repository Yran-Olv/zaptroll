services:
  postgres:
    image: postgres:16-alpine
    container_name: zaptroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zaptroll_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zaptroll_secret_pass}
      POSTGRES_DB: ${DB_NAME:-zaptroll_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zaptroll_user} -d ${DB_NAME:-zaptroll_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zaptroll_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zaptroll_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-zaptroll_user}:${DB_PASSWORD:-zaptroll_secret_pass}@postgres:5432/${DB_NAME:-zaptroll_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-zaptroll_user}
      DB_PASSWORD: ${DB_PASSWORD:-zaptroll_secret_pass}
      DB_NAME: ${DB_NAME:-zaptroll_db}
      JWT_SECRET: ${JWT_SECRET:-zaptroll_super_secure_jwt_secret_change_in_production_32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-Admin Zaptroll}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@zaptroll.local}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-Admin@SecurePass2026!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zaptroll_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zaptroll_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - zaptroll_network

volumes:
  pgdata:
    name: zaptroll_pgdata

networks:
  zaptroll_network:
    name: zaptroll_network
    driver: bridge
