services:
  postgres:
    image: postgres:16-alpine
    container_name: zaptroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zaptroll_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be defined}
      POSTGRES_DB: ${DB_NAME:-zaptroll_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zaptroll_user} -d ${DB_NAME:-zaptroll_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zaptroll_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zaptroll_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-zaptroll_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-zaptroll_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-zaptroll_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be defined}
      DB_NAME: ${DB_NAME:-zaptroll_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be defined (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-Admin Zaptroll}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:?FIRST_ADMIN_EMAIL must be defined}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?FIRST_ADMIN_PASSWORD must be defined}
      ALLOW_DEFAULT_CREDENTIALS: ${ALLOW_DEFAULT_CREDENTIALS:-true}
      APP_URL: ${APP_URL:-https://zaptroll.multivus.com.br}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_uploads:/app/uploads/media
    networks:
      - zaptroll_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zaptroll_frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18182}:80"
    depends_on:
      - backend
    networks:
      - zaptroll_network

volumes:
  pgdata:
    name: zaptroll_pgdata
  media_uploads:
    name: zaptroll_media

networks:
  zaptroll_network:
    name: zaptroll_network
    driver: bridge
