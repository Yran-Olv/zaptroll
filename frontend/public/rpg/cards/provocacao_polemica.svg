<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="mediaGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e0c03" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#mediaGlow)"/>

  <!-- TV Broadcast Graphics & Soundwaves -->
  <!-- Horizontal Broadcast Scanlines -->
  <line x1="40" y1="120" x2="560" y2="120" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="160" x2="560" y2="160" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="200" x2="560" y2="200" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="240" x2="560" y2="240" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="280" x2="560" y2="280" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="320" x2="560" y2="320" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>

  <!-- Concentric Soundwave Arcs from Center -->
  <path d="M 230,220 A 70,70 0 0,0 230,320" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 190,190 A 120,120 0 0,0 190,350" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 150,160 A 170,170 0 0,0 150,380" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.6"/>

  <path d="M 370,220 A 70,70 0 0,1 370,320" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 410,190 A 120,120 0 0,1 410,350" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 450,160 A 170,170 0 0,1 450,380" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Spiking Neon TV Rating Chart (IBOPE) -->
  <path d="M 70,440 L 170,410 L 250,430 L 330,320 L 410,340 L 520,140" fill="none" stroke="url(#chartGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)"/>
  <!-- Target Rating Pulse Point -->
  <circle cx="520" cy="140" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
  <text x="500" y="110" font-family="sans-serif" font-weight="900" font-size="18" fill="#10b981">+25% IBOPE</text>

  <!-- Giant Retro Megaphone / Loudspeaker -->
  <g transform="translate(180, 200)">
    <!-- Flare Cone -->
    <polygon points="120,70 240,10 240,130" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
    <ellipse cx="240" cy="70" rx="14" ry="60" fill="#f87171" stroke="#991b1b" stroke-width="4"/>
    <!-- Center speaker core -->
    <ellipse cx="240" cy="70" rx="6" ry="30" fill="#450a0a"/>
    <!-- Handle & body -->
    <rect x="70" y="55" width="55" height="30" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
    <path d="M 75,85 L 65,140 L 95,140 L 100,85 Z" fill="#1f2937" stroke="#111827" stroke-width="3"/>
    <!-- Sound Waves exiting megaphone -->
    <ellipse cx="280" cy="70" rx="20" ry="80" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.9"/>
    <ellipse cx="320" cy="70" rx="25" ry="110" fill="none" stroke="#fef3c7" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Orator / Politician in Background Laughing Smugly -->
  <g transform="translate(130, 210)">
    <!-- Head -->
    <circle cx="50" cy="40" r="28" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <!-- Hair -->
    <path d="M 25,35 Q 50,10 75,30 Q 60,18 35,25 Z" fill="#78350f"/>
    <!-- Open Laughing Mouth / Smirk -->
    <path d="M 40,46 Q 54,62 68,46 Z" fill="#991b1b" stroke="#78350f" stroke-width="2"/>
    <rect x="46" y="47" width="16" height="5" fill="#ffffff" rx="1"/>
    <!-- Squinting Happy Trolling Eyes -->
    <path d="M 36,36 Q 44,30 48,36" stroke="#78350f" stroke-width="3" fill="none"/>
    <path d="M 56,36 Q 62,30 68,36" stroke="#78350f" stroke-width="3" fill="none"/>
    <!-- Suit -->
    <path d="M 10,70 L 90,70 L 105,170 L 0,170 Z" fill="#1e1b4b" stroke="#312e81" stroke-width="3"/>
    <polygon points="40,70 60,70 54,120 46,120" fill="#fef08a"/>
    <polygon points="48,76 52,76 50,150" fill="#ef4444"/>
  </g>

  <!-- 'AO VIVO' / 'LIVE' Badge -->
  <rect x="60" y="90" width="110" height="36" rx="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <circle cx="80" cy="108" r="6" fill="#ffffff"/>
  <text x="120" y="114" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">AO VIVO</text>

  <!-- Top Title Banner -->
  <rect x="90" y="24" width="420" height="42" rx="10" fill="#1e0c03" stroke="url(#neonBorder)" stroke-width="3"/>
  <text x="300" y="52" font-family="sans-serif" font-weight="900" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="3">DEBOCHE EM REDE NACIONAL</text>

  <!-- Ornate Card Game Border -->
  <rect x="12" y="12" width="576" height="576" rx="24" fill="none" stroke="url(#neonBorder)" stroke-width="12"/>
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6"/>
  <!-- Corner Ornaments -->
  <circle cx="32" cy="32" r="14" fill="#b45309" stroke="#fef08a" stroke-width="3"/>
  <circle cx="568" cy="32" r="14" fill="#b45309" stroke="#fef08a" stroke-width="3"/>
  <circle cx="32" cy="568" r="14" fill="#b45309" stroke="#fef08a" stroke-width="3"/>
  <circle cx="568" cy="568" r="14" fill="#b45309" stroke="#fef08a" stroke-width="3"/>

  <!-- Bottom Stat Label -->
  <rect x="140" y="525" width="320" height="38" rx="8" fill="#1e0c03" stroke="url(#neonBorder)" stroke-width="2"/>
  <text x="300" y="550" font-family="sans-serif" font-weight="800" font-size="14" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">🗣️ MÍDIA // PROVOCAÇÃO TOTAL</text>
</svg>
