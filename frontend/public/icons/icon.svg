<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131722" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#39ff14" flood-opacity="0.5" />
    </filter>
  </defs>

  {/* Outer App Frame */}
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#2a3346" stroke-width="8" />

  {/* WhatsApp Chat Bubble Silhouette with Cyber Lime Border */}
  <path
    d="M256,64 C150,64 64,150 64,256 C64,295 76,332 96,364 L72,448 L160,426 C189,442 221,448 256,448 C362,448 448,362 448,256 C448,150 362,64 256,64 Z"
    fill="#161922"
    stroke="#39ff14"
    stroke-width="14"
    filter="url(#neonGlow)"
  />

  {/* Trollface Graphic Centered */}
  <g transform="translate(140, 150) scale(1.15)">
    {/* Head Outline */}
    <path
      d="M20 95 C15 45 45 15 105 15 C160 15 185 45 185 85 C185 130 145 150 95 150 C50 150 25 130 20 95 Z"
      fill="#ffffff"
      stroke="#111827"
      stroke-width="6"
    />
    {/* Forehead wrinkles */}
    <path d="M65 30 Q100 22 135 30" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <path d="M70 38 Q100 32 130 38" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    {/* Eyes */}
    <path d="M48 55 Q60 48 72 58" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <circle cx="60" cy="62" r="5" fill="#111827" />
    <path d="M120 56 Q135 48 150 54" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <circle cx="136" cy="60" r="5" fill="#111827" />
    {/* Nose */}
    <path d="M96 60 Q104 74 92 78 Q102 78 106 72" stroke="#111827" stroke-width="4" fill="none" />
    {/* Grin */}
    <path
      d="M32 82 C65 72 135 68 172 78 C175 118 135 142 90 140 C52 138 30 115 32 82 Z"
      fill="#f8fafc"
      stroke="#111827"
      stroke-width="5"
    />
    <path d="M34 88 C70 82 130 80 170 86" stroke="#111827" stroke-width="4" />
    <path d="M52 86 L50 115" stroke="#111827" stroke-width="3" />
    <path d="M68 85 L67 122" stroke="#111827" stroke-width="3" />
    <path d="M85 83 L84 126" stroke="#111827" stroke-width="3" />
    <path d="M103 83 L103 126" stroke="#111827" stroke-width="3" />
    <path d="M122 84 L123 123" stroke="#111827" stroke-width="3" />
    <path d="M140 85 L143 118" stroke="#111827" stroke-width="3" />
  </g>
</svg>
